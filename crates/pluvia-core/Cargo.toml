[package]
name = "pluvia-core"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
encoding_rs = "0.8"
libc = "0.2"
thiserror.workspace = true
zip = "2.2"
zbus = { version = "5.0", default-features = false, features = ["tokio", "blocking-api"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
regex = "1.10"
cairo-rs = "0.20"
pango = "0.20"
pangocairo = "0.20"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = "0.43"

[dev-dependencies]
tempfile = "3.12"

