[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Variables]
FontName=Sans
ColorCyan=0,245,212,255
ColorMagenta=247,37,133,255
ColorYellow=254,228,64,255
ColorWhite=255,255,255,230
ColorDim=255,255,255,120
BarBg=255,255,255,20

; ==========================================
; MEASURES (Core Matrix + GPU + Thermals)
; ==========================================

[MeasureCPUAvg]
Measure=CPU

[MeasureCore1]
Measure=CPU
Processor=1

[MeasureCore2]
Measure=CPU
Processor=2

[MeasureCore3]
Measure=CPU
Processor=3

[MeasureCore4]
Measure=CPU
Processor=4

[MeasureCore5]
Measure=CPU
Processor=5

[MeasureCore6]
Measure=CPU
Processor=6

[MeasureCore7]
Measure=CPU
Processor=7

[MeasureCore8]
Measure=CPU
Processor=8

[MeasureTemp]
Measure=Plugin
Plugin=CoreTemp.dll
CoreTempType=MaxTemperature

[MeasureGPU]
Measure=Plugin
Plugin=MSIAfterburner.dll
GpuType=Usage

[MeasureVRAM]
Measure=Plugin
Plugin=MSIAfterburner.dll
GpuType=MemoryPercent

[MeasureBattery]
Measure=Plugin
Plugin=PowerPlugin.dll
PowerState=Percent

[MeasureAC]
Measure=Plugin
Plugin=PowerPlugin.dll
PowerState=ACLine

; ==========================================
; METERS
; ==========================================

[MeterHUDCard]
Meter=Shape
Shape=Rectangle 0,0,340,320,14 | Fill Color 10,12,18,240 | StrokeWidth 1 | Stroke Color 0,245,212,80

[MeterHUDTitle]
Meter=String
X=20
Y=16
FontColor=#ColorCyan#
FontFace=#FontName#
FontSize=11
StringStyle=Bold
Text="SILICON TELEMETRY MATRIX"
AntiAlias=1

; --- CPU SUMMARY ---
[MeterCPUHeader]
Meter=String
MeasureName=MeasureCPUAvg
MeasureName2=MeasureTemp
X=20
Y=42
FontColor=#ColorWhite#
FontFace=#FontName#
FontSize=10
Text="CPU Total: %1%  •  %2°C"
AntiAlias=1

; --- 8 CORE MATRIX ---
[MeterCore1Bar]
Meter=Bar
MeasureName=MeasureCore1
