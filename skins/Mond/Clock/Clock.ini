[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
WindowX=2210
WindowY=260
WindowW=700
WindowH=200

[Variables]
FontName=Anurati
FontName2=Quicksand
Color1=226,232,240,255
Color2=214,214,214,255
Color3=160,174,192,255
Scale=1.0

[MeasureDay]
Measure=Time
Format=%A

[MeasureDate]
Measure=Time
Format=%d %B, %Y

[MeasureTime]
Measure=Time
Format=- %H:%M -

[MeterDay]
Meter=String
MeasureName=MeasureDay
FontFace=#FontName#
FontColor=#Color1#
FontSize=(44 * #Scale#)
StringAlign=Center
StringCase=Upper
InlineSetting=CharacterSpacing | 18 | 18
AntiAlias=1
X=350
Y=15
W=700
H=80

[MeterDate]
Meter=String
MeasureName=MeasureDate
FontFace=#FontName2#
FontColor=#Color2#
FontSize=(17 * #Scale#)
StringStyle=Bold
StringAlign=Center
StringCase=Upper
AntiAlias=1
X=350
Y=105
W=700
H=40

[MeterTime]
Meter=String
MeasureName=MeasureTime
FontFace=#FontName2#
FontColor=#Color3#
FontSize=(15 * #Scale#)
StringStyle=Bold
StringAlign=Center
AntiAlias=1
X=350
Y=150
W=700
H=40
