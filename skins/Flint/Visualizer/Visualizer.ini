; ==========================================
; METERS
; ==========================================

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,320,130,16 | Fill Color 15,18,25,230 | StrokeWidth 1 | Stroke Color 255,255,255,30

[MeterTitle]
Meter=String
X=20
Y=12
FontColor=255,255,255,220
FontFace=#FontName#
FontSize=9
StringStyle=Bold
Text="SPECTRUM VISUALIZER"
AntiAlias=1

; --- BARS 0 to 15 ---
[MeterBar0]
Meter=Bar
MeasureName=MeasureBand0
X=16
Y=35
W=#BarW#
H=#MaxH#
BarColor=#ColorAccent#
BarOrientation=Vertical

[MeterBar1]
Meter=Bar
MeasureName=MeasureBand1
X=(#BarW# + #BarGap#)r
Y=35
W=#BarW#
H=#MaxH#
BarColor=#ColorAccent#
BarOrientation=Vertical

