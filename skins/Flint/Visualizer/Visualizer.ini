[Rainmeter]
Update=40
AccurateText=1
DynamicWindowSize=1

[Variables]
FontName=Sans
ColorAccent=0,212,255,255
BarBg=255,255,255,20
BarW=12
BarGap=6
MaxH=80

; ==========================================
; AUDIO MEASURES (16 Frequency Bands)
; ==========================================

[MeasureAudio]
Measure=Plugin
Plugin=AudioLevel.dll
Port=Output
FFTSize=1024
FFTOverlap=512
FFTAttack=30
FFTDecay=250
Bands=16
FreqMin=40
FreqMax=16000
Sensitivity=45

[MeasureBand0]
Measure=Plugin
Plugin=AudioLevel.dll
Parent=MeasureAudio
Type=FFT
BandIdx=0

[MeasureBand1]
Measure=Plugin
Plugin=AudioLevel.dll
Parent=MeasureAudio
Type=FFT
BandIdx=1

