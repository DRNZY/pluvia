[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Variables]
FontName=Sans
ColorPrimary=255,255,255,240
ColorSecondary=255,255,255,140
ColorAccent=58,134,255,255
ColorGreen=76,201,154,255
ColorOrange=251,133,0,255
ColorRed=230,57,70,255
BarBgColor=255,255,255,25

; ==========================================
; MEASURES
; ==========================================

[MeasureCPU]
Measure=CPU

[MeasureCPUTemp]
Measure=Plugin
Plugin=CoreTemp.dll
CoreTempType=MaxTemperature

[MeasureRAM]
Measure=PhysicalMemory
Percent=1

[MeasureSwap]
Measure=SwapMemory
Percent=1

[MeasureDiskRoot]
Measure=FreeDiskSpace
Drive=/
Percent=1
InvertMeasure=1

[MeasureGPU]
Measure=Plugin
Plugin=MSIAfterburner.dll
GpuType=Usage

[MeasureGPUTemp]
Measure=Plugin
Plugin=MSIAfterburner.dll
GpuType=Temperature

[MeasureBattery]
Measure=Plugin
Plugin=PowerPlugin.dll
PowerState=Percent

[MeasureBatteryState]
Measure=Plugin
Plugin=PowerPlugin.dll
PowerState=StatusText

[MeasureNetIn]
Measure=NetIn

[MeasureNetOut]
Measure=NetOut

; ==========================================
; METERS
; ==========================================

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,320,400,16 | Fill Color 18,22,30,225 | StrokeWidth 1 | Stroke Color 255,255,255,35

[MeterTitle]
Meter=String
X=20
Y=18
FontColor=#ColorPrimary#
FontFace=#FontName#
FontSize=13
StringStyle=Bold
Text="SYSTEM TELEMETRY"
AntiAlias=1

; --- CPU ---
[MeterCPULabel]
Meter=String
X=20
Y=52
FontColor=#ColorSecondary#
FontFace=#FontName#
FontSize=10
Text="CPU Load"
AntiAlias=1

[MeterCPUValue]
Meter=String
MeasureName=MeasureCPU
MeasureName2=MeasureCPUTemp
X=300
Y=52
StringAlign=Right
FontColor=#ColorPrimary#
FontFace=#FontName#
FontSize=10
Text="%1%  •  %2°C"
AntiAlias=1

[MeterCPUBarBg]
Meter=Shape
X=20
Y=72
Shape=Rectangle 0,0,280,6,3 | Fill Color #BarBgColor# | StrokeWidth 0

[MeterCPUBar]
Meter=Bar
MeasureName=MeasureCPU
X=20
Y=72
W=280
H=6
BarColor=#ColorAccent#
SolidColor=0,0,0,0
BarOrientation=Horizontal

; --- RAM ---
[MeterRAMLabel]
Meter=String
X=20
Y=92
FontColor=#ColorSecondary#
FontFace=#FontName#
FontSize=10
Text="RAM Usage"
AntiAlias=1

[MeterRAMValue]
Meter=String
MeasureName=MeasureRAM
X=300
Y=92
StringAlign=Right
FontColor=#ColorPrimary#
FontFace=#FontName#
FontSize=10
Text="%1%"
AntiAlias=1

[MeterRAMBarBg]
Meter=Shape
X=20
Y=112
Shape=Rectangle 0,0,280,6,3 | Fill Color #BarBgColor# | StrokeWidth 0

[MeterRAMBar]
Meter=Bar
MeasureName=MeasureRAM
X=20
Y=112
W=280
H=6
BarColor=#ColorGreen#
SolidColor=0,0,0,0
BarOrientation=Horizontal

; --- GPU ---
[MeterGPULabel]
Meter=String
X=20
Y=132
FontColor=#ColorSecondary#
FontFace=#FontName#
FontSize=10
Text="GPU Load"
AntiAlias=1

[MeterGPUValue]
Meter=String
MeasureName=MeasureGPU
MeasureName2=MeasureGPUTemp
X=300
Y=132
StringAlign=Right
FontColor=#ColorPrimary#
FontFace=#FontName#
FontSize=10
Text="%1%  •  %2°C"
AntiAlias=1

[MeterGPUBarBg]
Meter=Shape
X=20
Y=152
Shape=Rectangle 0,0,280,6,3 | Fill Color #BarBgColor# | StrokeWidth 0

[MeterGPUBar]
Meter=Bar
MeasureName=MeasureGPU
X=20
Y=152
W=280
H=6
BarColor=#ColorOrange#
SolidColor=0,0,0,0
BarOrientation=Horizontal

; --- DISK ---
[MeterDiskLabel]
Meter=String
X=20
Y=172
FontColor=#ColorSecondary#
FontFace=#FontName#
FontSize=10
Text="Storage (Root /)"
AntiAlias=1

[MeterDiskValue]
Meter=String
MeasureName=MeasureDiskRoot
X=300
Y=172
StringAlign=Right
FontColor=#ColorPrimary#
FontFace=#FontName#
FontSize=10
Text="%1%"
AntiAlias=1

[MeterDiskBarBg]
Meter=Shape
X=20
Y=192
Shape=Rectangle 0,0,280,6,3 | Fill Color #BarBgColor# | StrokeWidth 0

[MeterDiskBar]
Meter=Bar
MeasureName=MeasureDiskRoot
X=20
Y=192
W=280
H=6
BarColor=180,100,240,255
SolidColor=0,0,0,0
BarOrientation=Horizontal

; --- BATTERY ---
[MeterBatteryLabel]
Meter=String
X=20
Y=212
FontColor=#ColorSecondary#
FontFace=#FontName#
FontSize=10
Text="Battery"
AntiAlias=1

[MeterBatteryValue]
Meter=String
MeasureName=MeasureBattery
MeasureName2=MeasureBatteryState
X=300
Y=212
StringAlign=Right
FontColor=#ColorPrimary#
FontFace=#FontName#
FontSize=10
Text="%1% (%2)"
AntiAlias=1

[MeterBatteryBarBg]
Meter=Shape
X=20
Y=232
Shape=Rectangle 0,0,280,6,3 | Fill Color #BarBgColor# | StrokeWidth 0

[MeterBatteryBar]
Meter=Bar
MeasureName=MeasureBattery
X=20
Y=232
W=280
H=6
BarColor=#ColorGreen#
SolidColor=0,0,0,0
BarOrientation=Horizontal

; --- NETWORK ---
[MeterNetTitle]
Meter=String
X=20
Y=255
FontColor=#ColorSecondary#
FontFace=#FontName#
FontSize=10
Text="Network I/O"
AntiAlias=1

[MeterNetInText]
Meter=String
MeasureName=MeasureNetIn
X=20
Y=275
FontColor=#ColorPrimary#
FontFace=#FontName#
FontSize=11
AutoScale=1
Text="▼  %1B/s"
AntiAlias=1

[MeterNetOutText]
Meter=String
MeasureName=MeasureNetOut
X=170
Y=275
FontColor=#ColorPrimary#
FontFace=#FontName#
FontSize=11
AutoScale=1
Text="▲  %1B/s"
AntiAlias=1
