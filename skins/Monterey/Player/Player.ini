[Rainmeter]
Update=500
AccurateText=1
DynamicWindowSize=1

[Variables]
FontName=Sans
ColorPrimary=255,255,255,245
ColorSecondary=255,255,255,150
ColorAccent=254,44,85,255
BarBgColor=255,255,255,25
BtnColor=255,255,255,220

; ==========================================
; MEASURES
; ==========================================

[MeasurePlayer]
Measure=NowPlaying
PlayerType=Title

[MeasureArtist]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Artist

[MeasureAlbum]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Album

[MeasureCover]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Cover

[MeasureProgress]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Progress

[MeasureState]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=State

[MeasurePosition]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Position

[MeasureDuration]
Measure=NowPlaying
PlayerName=[MeasurePlayer]
PlayerType=Duration

; ==========================================
; METERS
; ==========================================

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,320,180,18 | Fill Color 20,24,34,235 | StrokeWidth 1 | Stroke Color 255,255,255,40

[MeterCoverArt]
Meter=Image
MeasureName=MeasureCover
X=20
Y=20
W=56
H=56
SolidColor=255,255,255,15
AntiAlias=1

[MeterTrackTitle]
Meter=String
MeasureName=MeasurePlayer
X=90
Y=24
W=210
H=22
ClipString=1
FontColor=#ColorPrimary#
FontFace=#FontName#
FontSize=12
StringStyle=Bold
Text="%1"
AntiAlias=1

[MeterTrackArtist]
Meter=String
MeasureName=MeasureArtist
X=90
Y=48
W=210
H=18
ClipString=1
FontColor=#ColorSecondary#
FontFace=#FontName#
FontSize=10
Text="%1"
AntiAlias=1

; --- PROGRESS BAR ---
[MeterProgressBg]
Meter=Shape
X=20
Y=95
Shape=Rectangle 0,0,280,4,2 | Fill Color #BarBgColor# | StrokeWidth 0

[MeterProgressBar]
Meter=Bar
MeasureName=MeasureProgress
X=20
Y=95
W=280
H=4
BarColor=#ColorAccent#
SolidColor=0,0,0,0
BarOrientation=Horizontal

; --- CONTROLS ---
[MeterPrevBtn]
Meter=String
X=80
Y=120
W=36
H=36
FontColor=#BtnColor#
FontFace=#FontName#
FontSize=16
StringAlign=Center
Text="⏮"
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasurePlayer "Previous"]

[MeterPlayBtn]
Meter=String
X=160
Y=116
W=44
H=44
FontColor=#ColorPrimary#
FontFace=#FontName#
FontSize=20
StringAlign=Center
Text="⏯"
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasurePlayer "PlayPause"]

[MeterNextBtn]
Meter=String
X=240
Y=120
W=36
H=36
FontColor=#BtnColor#
FontFace=#FontName#
FontSize=16
StringAlign=Center
Text="⏭"
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasurePlayer "Next"]
