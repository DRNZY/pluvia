[workspace]
members = [
    "crates/pluvia-core",
    "crates/pluvia-daemon",
    "crates/pluvia-cli",
    "crates/pluvia-studio",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["DRNZY <https://github.com/DRNZY>"]
repository = "https://github.com/DRNZY/pluvia"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tokio = { version = "1.40", features = ["full"] }
